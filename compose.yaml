services:
  conwaysgame:
    container_name: portfolio-conways-game-app
    build:
      context: .
      dockerfile: Dockerfile
    image: conwaysgame:latest
    pull_policy: never
    restart: unless-stopped
    networks: [tunnel]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  tunnel:
    external: true
